[profile.default]
src = "src"
out = "out"
libs = ["lib", "../../node_modules"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts@4.8.3/=../../node_modules/@openzeppelin/contracts-4.8.3/",
    "@openzeppelin/contracts@5.0.2/=../../node_modules/@openzeppelin/contracts-5.0.2/",
    "@chainlink/contracts/=../../node_modules/@chainlink/contracts/",
    "@chainlink/contracts-ccip/=../../node_modules/@chainlink/contracts-ccip/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
ethereum_sepolia = "${ETHEREUM_SEPOLIA_RPC_URL}"

[etherscan]
arc_testnet = { key = "${ETHERSCAN_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
